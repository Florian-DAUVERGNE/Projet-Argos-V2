; Firmware Argos : un seul code source, un binaire par famille de puce.
; Voir docs/specification.md, section 12.
;
; Le support Arduino de l'ESP32-C6 demande le cœur Arduino-ESP32 3.x,
; fourni ici par la plateforme communautaire pioarduino.

[platformio]
default_envs = esp32

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; Deux emplacements de 1,9 Mo pour la mise à jour à distance (OTA), au lieu
; de 1,25 Mo par défaut. Ce découpage ne se change que par USB : il est fixé
; dès maintenant pour laisser de la place aux prochains pilotes.
board_build.partitions = min_spiffs.csv
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    bertmelis/espMqttClient @ ^1.7.0
build_flags =
    -DARGOS_FIRMWARE_VERSION=\"0.1.0\"

[env:esp32]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DARGOS_PUCE=\"esp32\"

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DARGOS_PUCE=\"esp32c3\"

[env:esp32c6]
board = esp32-c6-devkitc-1
build_flags =
    ${env.build_flags}
    -DARGOS_PUCE=\"esp32c6\"
