name: Firmware

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"

jobs:
  compiler:
    name: Compiler (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32, esp32c3, esp32c6]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer PlatformIO
        run: pip install --upgrade platformio

      - name: Compiler
        working-directory: firmware
        run: pio run -e ${{ matrix.env }}

      - name: Conserver le binaire
        uses: actions/upload-artifact@v4
        with:
          name: argos-${{ matrix.env }}
          path: firmware/.pio/build/${{ matrix.env }}/firmware.bin
